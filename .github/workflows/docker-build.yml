name: Build and Push Docker Image

# Builds the CUDA matrix from a single parameterised Dockerfile.
# Adding a target = adding one entry to the matrix below.

on:
  push:
    # `watch/**` carries the watcher's proposals. Building them is the point:
    # a pull request you cannot pull as an image has to be merged before it
    # can be judged, which defeats having a test branch at all.
    branches: [main, develop, 'watch/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which CUDA targets to build'
        type: choice
        default: all
        options: [all, cu130, cu129]

env:
  IMAGE_NAME: vlop12ui/pod-comfyui-h3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary target. Full NVFP4 tensor-core path, needs a host driver
          # 580+ (RunPod exposes machines up to CUDA 13.3).
          - target: cu130
            cuda_base: 13.3.1-cudnn-runtime-ubuntu24.04
            torch_index: cu130
            primary: true
            # Built by the "Build SageAttention wheel" workflow, from
            # thu-ml/SageAttention against this exact torch, CUDA and Python.
            # No such wheel is published for Linux anywhere upstream.
            #
            # The filename records python and platform but NOT which torch or
            # CUDA it was compiled against - pip cannot check that, and a
            # mismatch surfaces as an undefined symbol at import time. The
            # release tag carries it instead: wheels-cu130.
            #
            # Re-run that workflow after any torch or Python bump, and update
            # this URL. Leaving a stale wheel here is worse than leaving it
            # empty: empty degrades to PyTorch attention, stale breaks import.
            sa_wheel: 'https://github.com/unicorncomfyui/pod-comfyui-h3/releases/download/wheels-cu130/sageattention-2.2.0-cp313-cp313-linux_x86_64.whl'
          # Safety net for the large part of the RunPod fleet still on 12.x
          # drivers. Same torch version, older CUDA runtime.
          - target: cu129
            cuda_base: 12.9.2-cudnn-runtime-ubuntu24.04
            torch_index: cu129
            primary: false
            sa_wheel: ''

    steps:
      - name: Skip target if not selected
        id: gate
        run: |
          SEL="${{ github.event.inputs.targets }}"
          # A proposal only needs the target you actually test on. Building
          # the compatibility image too would double a long build for a
          # branch whose purpose is to be judged and then deleted.
          if [ "${{ startsWith(github.ref, 'refs/heads/watch/') }}" = "true" ] \
             && [ "${{ matrix.primary }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Proposal branch: building the primary target only."
            exit 0
          fi
          if [ -z "$SEL" ] || [ "$SEL" = "all" ] || [ "$SEL" = "${{ matrix.target }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Target ${{ matrix.target }} not selected, skipping."
          fi

      # The runner ships with ~14 GB free; this image needs far more during
      # build. Clearing the preinstalled toolchains buys back ~25 GB.
      - name: Free up disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift \
                      /usr/local/.ghcup /usr/local/share/boost \
                      /usr/local/graalvm /usr/local/share/chromium \
                      /usr/local/share/powershell
          sudo apt-get clean
          sudo docker system prune --all --force --volumes
          echo "After:"; df -h /

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Pull requests build but never publish.
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Every tag carries the CUDA target, so cu130 and cu129 images can
          # never overwrite each other. Only cu130 claims the bare aliases.
          #
          # The bare `cu130` tag is a MOVING alias that pods pull by name, so
          # only main may move it. Left unguarded it was written by both
          # branches alike, which meant pushing a work-in-progress to develop
          # silently replaced what production pulls on its next pod start -
          # with nothing in the logs to connect the two. `latest` was already
          # protected this way; this closes the same hole one tag lower.
          #
          # develop still publishes cu130-develop and the immutable
          # cu130-<date>-<sha>, which is what a test pod should point at.
          tags: |
            type=raw,value=${{ matrix.target }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.target }}-{{branch}}
            type=raw,value=${{ matrix.target }}-{{branch}}-{{sha}}
            type=raw,value=${{ matrix.target }}-{{date 'YYYYMMDD'}}-{{sha}}
            type=raw,value=latest,enable=${{ matrix.primary && github.ref == 'refs/heads/main' }}
            type=semver,pattern=${{ matrix.target }}-{{version}}
            # One stable name to point a test pod at while judging a
            # proposal, so you paste a tag instead of a branch-derived
            # mouthful. It moves with each proposal, which is fine: only one
            # is ever under review, and the sha tag above stays immutable if
            # you need to come back to a specific build.
            type=raw,value=${{ matrix.target }}-proposal,enable=${{ startsWith(github.ref, 'refs/heads/watch/') }}

      - name: Build and push
        if: steps.gate.outputs.run == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            CUDA_BASE=${{ matrix.cuda_base }}
            TORCH_INDEX=${{ matrix.torch_index }}
            SAGEATTENTION_WHEEL=${{ matrix.sa_wheel }}
          # Registry cache, not type=gha: the GitHub Actions cache is capped at
          # 10 GB per repository, and this image's layers run to ~15 GB per
          # target. Two targets against a shared 10 GB budget would evict each
          # other every run and never produce a hit. Docker Hub has no such cap
          # and we are already authenticated against it.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.target }}
          # Skipped on pull requests, which never log in to the registry.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE_NAME, matrix.target) || '' }}

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        run: |
          {
            echo "## ${{ matrix.target }} 🐳"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Base | \`nvidia/cuda:${{ matrix.cuda_base }}\` |"
            echo "| PyTorch index | \`${{ matrix.torch_index }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # Security scanning.
      #
      # trivy-action is pinned to a commit SHA, not @master: these steps hold
      # `security-events: write`, so whatever is on that branch at run time
      # executes here with those rights. A tag is not enough - tags move.
      #
      # The scan runs after the push rather than before it. Scanning first
      # would mean loading a ~15 GB image into the runner's local daemon, on a
      # runner we already have to strip 25 GB of preinstalled toolchains just
      # to build. The secret gate at the end fails the job loudly instead, and
      # everything is scanned by digest, so it is exactly the pushed artifact.
      # -----------------------------------------------------------------------
      - name: Trivy scan
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          # Ubuntu ships kernel headers (linux-libc-dev, pulled in by
          # libc6-dev), and Trivy maps the entire Linux CVE list onto them.
          # None of it is reachable: a container runs the host's kernel, never
          # its own. Left unfiltered the signal drowns - the first run reported
          # 1798 alerts, topped by a Marvell ARM ethernet driver bug.
          ignore-unfixed: true

      - name: Upload Trivy results
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}

      # An SBOM answers "do my images ship the thing in today's advisory?"
      # without pulling 15 GB back down to find out.
      - name: Generate SBOM
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.target }}.cdx.json
          skip-setup-trivy: true   # already installed above

      - name: Upload SBOM
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.target }}
          path: sbom-${{ matrix.target }}.cdx.json
          retention-days: 90

      # Last, so the alerts and the SBOM are recorded even when this fails.
      #
      # This is the only scan that blocks. An unpatched Ubuntu CVE is not
      # something we can fix and must not wedge the pipeline; anything this
      # scanner flags is ours, and is fixed rather than published.
      - name: Fail on secrets in the image
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: secret
          format: table
          exit-code: 1
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
